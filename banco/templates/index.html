<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Central - IES Celia Viñas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; }
        .login-container { max-width: 450px; margin-top: 10vh; }
        .logo-banco { font-size: 3rem; color: #0d6efd; text-align: center; margin-bottom: 20px;}
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
            <div class="card-header text-center bg-primary text-white">
                <h3 class="font-weight-light my-2">Banco Central</h3>
                <h6 class="font-weight-light">IES Celia Viñas</h6>
            </div>
            <div class="card-body p-4">
                
                {% if mensaje %}
                    <div class="alert alert-{{ estado }} text-center fw-bold" role="alert">
                        {{ mensaje }}
                    </div>
                {% endif %}

                <form method="post">
                    <div class="form-floating mb-3">
                        <input class="form-control text-center fs-3 letter-spacing" id="pin" name="pin" type="text" maxlength="4" placeholder="0000" autocomplete="off" required />
                        <label for="pin">PIN de acceso (4 cifras)</label>
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button class="btn btn-primary btn-lg" type="submit">Acceder a la cuenta</button>
                    </div>
                </form>

            </div>
            <div class="card-footer text-center py-3">
                <div class="small text-muted">Aviso: Todo acceso no autorizado será reportado</div>
            </div>
        </div>
    </div>
</body>
</html>
