<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Corp - Intranet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container { 
            max-width: 400px; 
            margin-top: 8vh; 
        }
        .capsule-header {
            background-color: #00a8e8; /* Azul cyan típico de Capsule Corp */
            color: white;
            border-bottom: 4px solid #007ea7;
        }
        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .hint-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Capsule Corp Logo" class="logo-img rounded-circle shadow-sm">            <h2 class="fw-bold text-dark mt-2">Capsule Corp</h2>
            <p class="text-muted">Acceso a la Red Interna</p>
        </div>

        <div class="card shadow border-0 rounded-3">
            <div class="card-header text-center capsule-header py-3">
                <h5 class="mb-0 fw-bold">Autenticación Requerida</h5>
            </div>
            <div class="card-body p-4">
                
                {% if mensaje %}
                    <div class="alert alert-{{ estado }} text-center fw-bold" role="alert">
                        {{ mensaje }}
                    </div>
                {% endif %}

                <form method="post">
                    <div class="mb-3">
                        <label for="user" class="form-label fw-semibold">ID de Empleado</label>
                        <input type="text" class="form-control bg-light" id="user" name="user" required autocomplete="off">
                    </div>
                    <div class="mb-4">
                        <label for="pass" class="form-label fw-semibold">Contraseña</label>
                        <input type="password" class="form-control bg-light" id="pass" name="pass" required>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-lg fw-bold" style="background-color: #00a8e8; border-color: #007ea7;" type="submit">Iniciar Sesión</button>
                    </div>
                </form>

            </div>
            <div class="card-footer bg-white text-center py-3 border-0">
                <p class="hint-text mb-0"><i>Pista de recuperación: El ID de usuario se compone del nombre, año de nacimiento y apellido del administrador de sistemas (todo en minúsculas).</i></p>
            </div>
        </div>
        
    </div>
</body>
</html>
